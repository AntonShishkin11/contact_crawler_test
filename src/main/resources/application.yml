spring:
  application:
    name: contact-crawler
  datasource:
    url: jdbc:h2:mem:contact_crawler;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,http.server.requests
  metrics:
    tags:
      application: contact-crawler

logging:
  level:
    org.hibernate.SQL: warn